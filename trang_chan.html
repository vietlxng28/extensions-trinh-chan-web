<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <title>Đã Chặn Truy Cập</title>
        <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at center, #ff2a2a 0%, #d63031 40%, #8b0000 100%);
            color: #2d3436;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
        }
        .container {
            text-align: center;
            padding: 56px 40px;
            background-color: #ffffff;
            border: 3px solid #ff4757;
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45), 0 0 40px rgba(255, 0, 0, 0.3);
            transition: transform 0.2s ease;
        }
        .icon {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            fill: #ff4757;
            filter: drop-shadow(0 4px 12px rgba(255, 71, 87, 0.35));
        }
        h1 {
            color: #2d3436;
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #custom-message {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.5;
            color: #1e272e;
            margin: 0 0 16px 0;
            white-space: pre-line;
            background-color: #fff5f5;
            border-left: 5px solid #d63031;
            padding: 16px 20px;
            border-radius: 8px;
            text-align: center;
        }
        .highlight {
            font-size: 19px;
            color: #d63031;
            font-weight: 700;
            margin-top: 16px;
            display: block;
            letter-spacing: 0.3px;
        }
        .signature {
            position: absolute;
            bottom: 24px;
            right: 32px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 500;
            letter-spacing: 0.5px;
            user-select: none;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .signature strong {
            color: #ffffff;
            transition: color 0.3s ease;
        }
        .signature:hover,
        .signature:hover strong {
            color: #ffeaa7;
        }
        </style>
    </head>
    <body>
        <div class="container">
        <svg class="icon" viewBox="0 0 24 24">
            <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"
            />
        </svg>
        <h1>Truy Cập Bị Chặn</h1>
        <p id="custom-message">Trang web này nằm trong danh sách hạn chế.</p>
        <p class="highlight">Hãy quay lại làm việc ngay thôi!</p>
        </div>

        <a href="#" id="signature-link" class="signature" target="_blank" rel="noopener noreferrer">Made by <strong>Lxng</strong></a>
        <script src="constant.js"></script>
        <script src="trang_chan.js"></script>
    </body>
</html>
